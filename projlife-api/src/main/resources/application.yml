server:
  port: 8080

spring:
  application:
    name: projlife-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:projlife}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false

projlife:
  redis:
    enabled: ${PROJLIFE_REDIS_ENABLED:true}
  security:
    # 生产必须经环境变量注入，禁止入库入码（16 册 §八 第 14 条）
    jwt-secret: ${PROJLIFE_JWT_SECRET:dev-only-projlife-jwt-secret-0123456789abcdef0123456789abcdef}
  storage:
    root: ${PROJLIFE_STORAGE_ROOT:./data/storage}
  ai-gateway:
    base-url: ${PROJLIFE_AI_GATEWAY:http://localhost:8090}
  notify:
    wechat:
      enabled: false

logging:
  file:
    name: logs/projlife-app.log
  level:
    com.projlife: info
