server:
  port: 8080

spring:
  application:
    name: projlife-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:projlife}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true&connectTimeout=3000&socketTimeout=60000
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false

projlife:
  redis:
    enabled: ${PROJLIFE_REDIS_ENABLED:true}
  security:
    # 生产必须经环境变量注入，禁止入库入码（16 册 §八 第 14 条）
    jwt-secret: ${PROJLIFE_JWT_SECRET:dev-only-projlife-jwt-secret-0123456789abcdef0123456789abcdef}
  storage:
    root: ${PROJLIFE_STORAGE_ROOT:./data/storage}
  ai-gateway:
    base-url: ${PROJLIFE_AI_GATEWAY:http://localhost:8090}
  notify:
    wechat:
      enabled: false
  # 外部系统接入（SPRINT-INT1）：凭据一律环境变量注入，未配置即 enabled=false 自动降级
  integ:
    dingtalk:
      enabled: ${PROJLIFE_DINGTALK_ENABLED:false}
      app-key: ${PROJLIFE_DINGTALK_APP_KEY:}
      app-secret: ${PROJLIFE_DINGTALK_APP_SECRET:}
      agent-id: ${PROJLIFE_DINGTALK_AGENT_ID:}
      webhook: ${PROJLIFE_DINGTALK_WEBHOOK:}
      webhook-secret: ${PROJLIFE_DINGTALK_WEBHOOK_SECRET:}
      # 测试期静态映射 "sys_userId:钉钉userid"（生产批次上通讯录同步，A-39）
      user-mapping: ${PROJLIFE_DINGTALK_USER_MAPPING:}
    shb:
      enabled: ${PROJLIFE_SHB_ENABLED:false}
      app-key: ${PROJLIFE_SHB_APP_KEY:}
      app-secret: ${PROJLIFE_SHB_APP_SECRET:}
      base-url: ${PROJLIFE_SHB_BASE_URL:https://oapi.shb.ltd}
      webhook-shared-key: ${PROJLIFE_SHB_WEBHOOK_KEY:}
    tplus:
      enabled: ${PROJLIFE_TPLUS_ENABLED:false}
      base-url: ${PROJLIFE_TPLUS_BASE_URL:https://hbtgl.a4.cjtmsp.com}
      app-key: ${PROJLIFE_TPLUS_APP_KEY:}
      app-secret: ${PROJLIFE_TPLUS_APP_SECRET:}
      org-id: ${PROJLIFE_TPLUS_ORG_ID:}
      token-mode: ${PROJLIFE_TPLUS_TOKEN_MODE:REALNAME}
      user-name: ${PROJLIFE_TPLUS_USER_NAME:}
      password: ${PROJLIFE_TPLUS_PASSWORD:}
      acc-num: ${PROJLIFE_TPLUS_ACC_NUM:}
      private-key: ${PROJLIFE_TPLUS_PRIVATE_KEY:}

logging:
  file:
    name: logs/projlife-app.log
  level:
    com.projlife: info
