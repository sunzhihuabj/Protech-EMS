# Protech 反向代理（09 册安全边界：远程仅白名单路径）
server {
  listen 80;
  server_name _;

  # 前端静态资源
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # API 反代（内网全量；远程访问建议配合 VPN 或白名单路径）
  location /api/ {
    proxy_pass http://api:9090;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    client_max_body_size 60m; # FR-M00-010 单附件 ≤50MB
  }

  # 远程暴露面收敛（09 册 §三：看板/待办/登录三组路径 + 强鉴权）
  location /kb/executive {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # MinIO 控制台不对外
  location /minio/ {
    deny all;
  }
}
