server:
  port: 8090

spring:
  application:
    name: projlife-ai-gateway
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:projlife}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

projlife:
  ai:
    # 模型端点（chat/completions 协议兼容 chat/completions 全 URL）；为空即 mock 模式（S0 默认）
    model-endpoint: ${PROJLIFE_AI_MODEL_ENDPOINT:}
    # Bearer Key（测试阶段经环境变量注入；生产轮换 + 仅内网分发，严禁入库入码）
    api-key: ${PROJLIFE_AI_API_KEY:}
    # 推理模型名；key+endpoint+model 三者齐备即启用真实推理，否则回退 mock
    model-name: ${PROJLIFE_AI_MODEL_NAME:}
    # 关闭思维链（实测 glm-5.3-flash 38.9s→16.4s；deepseek-v4.1-flash 思维链失控 236s 耗尽 token）
    disable-thinking: ${PROJLIFE_AI_DISABLE_THINKING:true}
    # 模型读超时 ms（真实推理含网络波动建议 ≥90000）
    timeout-ms: ${PROJLIFE_AI_TIMEOUT_MS:90000}

logging:
  file:
    name: logs/projlife-ai-gateway.log
