server:
  port: 8081

spring:
  application:
    name: projlife-job
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:projlife}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/shedlock.sql
      continue-on-error: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

projlife:
  redis:
    enabled: ${PROJLIFE_REDIS_ENABLED:true}
  job:
    enabled: ${PROJLIFE_JOB_ENABLED:false}

logging:
  file:
    name: logs/projlife-job.log
